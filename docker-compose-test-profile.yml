# Overlay for CI/test stacks only: enables the "test" Spring profile, which exposes
# the internal test-only APIs (/v1/internal/**). Never use it for a real deployment.
# Usage: docker compose -f docker-compose-postgresql-activemq.yml -f docker-compose-test-profile.yml up -d

services:
  fineract-manager:
    environment:
      - SPRING_PROFILES_ACTIVE=test,diagnostics

  fineract-worker:
    environment:
      - SPRING_PROFILES_ACTIVE=test,diagnostics
